[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-regresion"
version = "0.1.0"
description = "MVP multiagente para planes de regresión funcional a partir de Jira, Confluence y documentación local"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
qa-regresion = "qa_regresion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qa_regresion = ["prompts/*.md", "config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
